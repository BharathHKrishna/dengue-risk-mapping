<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dengue Risk Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title">
      <h1>Dengue risk map</h1>
      <span class="sub">Climate, land and population based model. Trained on Brazil, transferred to India.</span>
    </div>
    <div class="controls">
      <label>View
        <select id="view">
          <option value="brazil">Brazil municipalities</option>
          <option value="india_districts">India districts (unvalidated)</option>
          <option value="india_states">India states (validation)</option>
        </select>
      </label>
      <label id="layerWrap">Layer
        <select id="layer"></select>
      </label>
      <label class="slider">
        <span id="monthLabel">-</span>
        <input id="month" type="range" min="0" max="0" value="0">
      </label>
    </div>
  </header>
  <main>
    <div id="map"></div>
    <div id="banner" class="banner"></div>
    <aside id="panel">
      <p class="hint">Click a region to see its predicted risk, uncertainty interval, top drivers and data dates.</p>
    </aside>
  </main>
  <footer id="footer">Loading data dates...</footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
